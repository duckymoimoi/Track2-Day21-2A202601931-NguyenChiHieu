# Bonus 2: select random_forest, gradient_boosting, or logistic_regression.
model_type: random_forest

random_forest:
  n_estimators: 400
  max_depth: null
  min_samples_split: 2
  min_samples_leaf: 2

gradient_boosting:
  n_estimators: 150
  learning_rate: 0.05
  max_depth: 3

logistic_regression:
  C: 1.0
  max_iter: 2000
