name: MLOps Pipeline

on:
  push:
    branches: [main]
    paths:
      - "data/**.dvc"
      - "src/**.py"
      - "tests/**.py"
      - "params.yaml"
      - "requirements*.txt"
      - ".github/workflows/mlops.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PYTHON_VERSION: "3.10"
  GCS_BUCKET: vinuni-mlops-day21-79888249254
  GCP_PROJECT_ID: project-c2976661-717f-46ca-9ce
  GCP_SERVICE_ACCOUNT: mlops-lab-sa@project-c2976661-717f-46ca-9ce.iam.gserviceaccount.com
  WIF_PROVIDER: projects/79888249254/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider

jobs:
  test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run unit tests
        run: pytest tests/ -v

  train:
    name: Train
    needs: test
    runs-on: ubuntu-latest
    outputs:
      accuracy: ${{ steps.metrics.outputs.accuracy }}
      f1_score: ${{ steps.metrics.outputs.f1_score }}
    env:
      MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
      MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
      MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Authenticate to Google Cloud without a service-account key
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
      - name: Pull training and evaluation data with DVC
        run: dvc pull data/train_phase1.csv.dvc data/eval.csv.dvc
      - name: Train model and create performance report
        run: python src/train.py
      - name: Read metrics
        id: metrics
        shell: bash
        run: |
          accuracy=$(python -c "import json; print(json.load(open('outputs/metrics.json'))['accuracy'])")
          f1_score=$(python -c "import json; print(json.load(open('outputs/metrics.json'))['f1_score'])")
          echo "accuracy=$accuracy" >> "$GITHUB_OUTPUT"
          echo "f1_score=$f1_score" >> "$GITHUB_OUTPUT"
      - name: Upload candidate model and evidence to GCS
        env:
          CANDIDATE_PREFIX: candidates/${{ github.sha }}
        run: |
          python - <<'PY'
          import os
          from google.cloud import storage

          bucket = storage.Client().bucket(os.environ["GCS_BUCKET"])
          files = {
              "models/model.pkl": "model.pkl",
              "outputs/metrics.json": "metrics.json",
              "outputs/report.txt": "report.txt",
          }
          for local_path, filename in files.items():
              key = f"{os.environ['CANDIDATE_PREFIX']}/{filename}"
              bucket.blob(key).upload_from_filename(local_path)
              print(f"Uploaded gs://{bucket.name}/{key}")
          PY
      - name: Save metrics and report as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: training-evidence-${{ github.run_number }}
          path: |
            outputs/metrics.json
            outputs/report.txt

  eval:
    name: Eval
    needs: train
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install google-cloud-storage==2.16.0
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
      - name: Check quality gate and prevent model regression
        env:
          NEW_ACCURACY: ${{ needs.train.outputs.accuracy }}
        run: |
          python - <<'PY'
          import json
          import os
          from google.cloud import storage

          threshold = 0.70
          new_accuracy = float(os.environ["NEW_ACCURACY"])
          print(f"Candidate accuracy: {new_accuracy:.4f}")
          if new_accuracy < threshold:
              raise SystemExit(
                  f"FAILED: accuracy {new_accuracy:.4f} < {threshold:.2f}. Deploy blocked."
              )

          bucket = storage.Client().bucket(os.environ["GCS_BUCKET"])
          current_metrics = bucket.blob("models/latest/metrics.json")
          if current_metrics.exists():
              previous = json.loads(current_metrics.download_as_text())
              previous_accuracy = float(previous["accuracy"])
              print(f"Current production accuracy: {previous_accuracy:.4f}")
              if new_accuracy < previous_accuracy:
                  raise SystemExit(
                      f"REGRESSION: {new_accuracy:.4f} < {previous_accuracy:.4f}. "
                      "Keeping the current production model."
                  )
          else:
              print("No production model yet; threshold is the only gate.")
          print("PASSED: candidate may be promoted.")
          PY

  deploy:
    name: Deploy
    needs: [train, eval]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install google-cloud-storage==2.16.0
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
      - name: Promote candidate to models/latest
        env:
          CANDIDATE_PREFIX: candidates/${{ github.sha }}
        run: |
          python - <<'PY'
          import os
          from google.cloud import storage

          bucket = storage.Client().bucket(os.environ["GCS_BUCKET"])
          for filename in ["model.pkl", "metrics.json", "report.txt"]:
              source = bucket.blob(f"{os.environ['CANDIDATE_PREFIX']}/{filename}")
              bucket.copy_blob(source, bucket, f"models/latest/{filename}")
              print(f"Promoted {filename}")
          PY
      - name: Copy serving code to VM
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          source: "src/serve.py"
          target: "/home/ACER/mlops-app"
          overwrite: true
      - name: Restart service and verify health
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            sudo systemctl restart mlops-serve
            for attempt in $(seq 1 12); do
              if curl -sf http://localhost:8000/health; then
                echo "Health check passed."
                exit 0
              fi
              echo "Waiting for API (attempt $attempt/12)..."
              sleep 5
            done
            sudo journalctl -u mlops-serve -n 50 --no-pager
            exit 1
